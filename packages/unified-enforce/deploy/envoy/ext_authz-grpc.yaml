# Envoy sidecar template — unified-enforce ext_authz (gRPC transport). E3.
#
# The locked data-plane target: Envoy consults the engine's
# envoy.service.auth.v3.Authorization servicer (unified_enforce.extauthz_grpc)
# on every request and enforces the verdict.
#
# Pair with an egress policy from deploy/egress/ — Envoy is only the lock if
# the agent has no route around it.
#
# Validated against Envoy's real schema by
# tests/integration/test_envoy_ext_authz.py (needs Docker). Manually:
#   docker run --rm -v "$PWD:/cfg" envoyproxy/envoy:v1.31-latest \
#     envoy --mode validate -c /cfg/ext_authz-grpc.yaml

static_resources:
  listeners:
    - name: agent_egress
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: agent_egress
                route_config:
                  name: all
                  # An agent must not be able to name its own principal: strip the
                  # header on ingress so only trusted infrastructure (or the mTLS
                  # SAN, or the sidecar's configured default_principal) sets it.
                  request_headers_to_remove: ["x-unified-principal"]
                  virtual_hosts:
                    - name: upstream
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: dynamic_forward }
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: false   # engine down => deny (fail closed)
                      include_peer_certificate: true  # populates source.principal (mTLS SAN)
                      grpc_service:
                        envoy_grpc: { cluster_name: unified_enforce }
                        timeout: 0.050s           # decision budget is <10ms; 50ms is headroom
                  - name: envoy.filters.http.dynamic_forward_proxy
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                      dns_cache_config:
                        name: egress_dns
                        dns_lookup_family: V4_ONLY
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: unified_enforce
      type: STATIC
      connect_timeout: 0.25s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}   # gRPC requires HTTP/2
      load_assignment:
        cluster_name: unified_enforce
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 9001 }
    - name: dynamic_forward
      connect_timeout: 5s
      lb_policy: CLUSTER_PROVIDED
      cluster_type:
        name: envoy.clusters.dynamic_forward_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
          dns_cache_config:
            name: egress_dns
            dns_lookup_family: V4_ONLY
