# Envoy sidecar template — unified-enforce ext_authz (HTTP transport). E3 scaffold.
#
# Every request an agent makes egresses through this listener; the ext_authz
# filter consults the engine (127.0.0.1:9002) and enforces its verdict.
# failure_mode_allow is false: if the engine is down, traffic is DENIED.
#
# The no-bypass guarantee is egress policy AROUND this sidecar (NetworkPolicy /
# iptables / security groups): the agent's network namespace must have no route
# out except this listener. Templates per deployment mode ship with E3 proper.
#
# gRPC transport swap (locked target, same engine core): replace http_service
# with grpc_service pointing at the engine's Authorization servicer.

static_resources:
  listeners:
    - name: agent_egress
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: agent_egress
                route_config:
                  name: all
                  virtual_hosts:
                    - name: upstream
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: dynamic_forward }
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: false   # engine down => deny (fail closed)
                      http_service:
                        server_uri:
                          uri: http://127.0.0.1:9002
                          cluster: unified_enforce
                          timeout: 0.050s          # decision budget is <10ms; 50ms is headroom
                        authorization_request:
                          allowed_headers:
                            patterns:
                              - exact: x-unified-principal
                              - exact: traceparent
                              - exact: host
                              - exact: x-forwarded-host
                              - exact: x-forwarded-proto
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - prefix: x-unified-
                          allowed_client_headers:
                            patterns:
                              - prefix: x-unified-
                  - name: envoy.filters.http.dynamic_forward_proxy
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                      dns_cache_config:
                        name: egress_dns
                        dns_lookup_family: V4_ONLY
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: unified_enforce
      type: STATIC
      connect_timeout: 0.25s
      load_assignment:
        cluster_name: unified_enforce
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 9002 }
    - name: dynamic_forward
      type: LOGICAL_DNS
      connect_timeout: 5s
      lb_policy: CLUSTER_PROVIDED
      cluster_type:
        name: envoy.clusters.dynamic_forward_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
          dns_cache_config:
            name: egress_dns
            dns_lookup_family: V4_ONLY
