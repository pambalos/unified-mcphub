{
  "_comment": "osquery pack for the Unified AI host sensor (build-14 S-3). Names only: no cmdline, no process_envs, no file tables. Use with osqueryd when you already ship osquery results to a collector; otherwise run `python -m unified_enforce.host_sensor`, which asks the same questions through osqueryi and posts them itself.",
  "queries": {
    "unified_processes": {
      "query": "SELECT p.name AS name, pp.name AS parent, u.username AS user FROM processes p LEFT JOIN processes pp ON pp.pid = p.parent LEFT JOIN users u ON u.uid = p.uid WHERE p.name != '';",
      "interval": 300,
      "snapshot": true,
      "description": "Every process by name, with its parent's name and its user. The control plane classifies against agent-runtimes.v1."
    },
    "unified_listening_ports": {
      "query": "SELECT lp.port AS port, lp.protocol AS protocol, p.name AS process FROM listening_ports lp LEFT JOIN processes p ON p.pid = lp.pid WHERE lp.port > 0;",
      "interval": 300,
      "snapshot": true,
      "description": "Listening sockets and the process behind each; model runtimes listen on known ports."
    },
    "unified_python_packages": {
      "query": "SELECT name, version FROM python_packages;",
      "interval": 3600,
      "snapshot": true,
      "description": "Installed Python packages by name; agent SDKs and frameworks are on the list."
    }
  }
}
