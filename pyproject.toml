# Virtual uv workspace root for the unified-mcphub product.
# No [project] table → uv treats this as a virtual workspace; the real packages
# live under packages/* (the hub CLI + its two internal libraries).
[tool.uv.workspace]
members = ["packages/*"]
# unified-mcp-graphify is an optional, heavy server (graphify pulls ~29 tree-sitter
# grammars + an LLM backend). Keep it OUT of the shared workspace venv/lockfile and
# the tiny default tier — it is built/run standalone via uvx. Its tests run on their
# own: `cd packages/unified-mcp-graphify && uv run --extra dev pytest`.
exclude = ["packages/unified-mcp-graphify"]

# Dev tooling for the whole workspace (uv installs this group by default).
[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    # unified-enforce[otel] equivalents so the telemetry tests run in the
    # workspace venv (the extra itself stays optional for consumers).
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
]

# Shared test/lint config so a workspace-wide run behaves identically to the
# per-package config (the hub package also declares these locally).
[tool.pytest.ini_options]
asyncio_mode = "auto"
# unified-mcp-graphify is excluded from the workspace (heavy graphify deps), so it
# is NOT installed in the workspace venv. Skip it in the workspace-wide `pytest
# packages` run — it has its own standalone suite (`cd packages/unified-mcp-graphify
# && uv run --extra dev pytest`). Without this, collection would ImportError.
addopts = "--ignore=packages/unified-mcp-graphify"

[tool.ruff]
line-length = 100
target-version = "py312"
