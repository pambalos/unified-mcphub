# Virtual uv workspace root for the unified-mcphub product.
# No [project] table → uv treats this as a virtual workspace; the real packages
# live under packages/* (the hub CLI + its two internal libraries).
[tool.uv.workspace]
members = ["packages/*"]
# unified-mcp-graphify is an optional, heavy server (graphify pulls ~29 tree-sitter
# grammars + an LLM backend). Keep it OUT of the shared workspace venv/lockfile and
# the tiny default tier — it is built/run standalone via uvx. Its tests run on their
# own: `cd packages/unified-mcp-graphify && uv run --extra dev pytest`.
exclude = ["packages/unified-mcp-graphify"]

# Dev tooling for the whole workspace (uv installs this group by default).
[dependency-groups]
# crewai lives in its own group, not `dev`, for two reasons: it cannot install
# on macOS x86_64 at all (lancedb has no wheel), and on musl it drags in
# onnxruntime, which has no musllinux wheel either — so a plain `uv sync` in an
# Alpine container would fail on a dependency nothing in that container needs.
# CI adds `--group crewai` on glibc Linux, where the real adapter test runs.
crewai = ["crewai>=0.80.0 ; sys_platform == 'linux'"]

dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    # unified-enforce[otel] equivalents so the telemetry tests run in the
    # workspace venv (the extra itself stays optional for consumers).
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    # unified-enforce[gateway] equivalents for the ext_authz transport tests,
    # plus grpcio-tools to regenerate the vendored ext_authz stubs.
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "langchain-core>=1.5.4",
    "llama-index-core>=0.14.23",
    "mypy>=2.1.0",
    "types-protobuf>=7.34.1.20260518",
    "types-pyyaml>=6.0.12.20260724",
    "types-grpcio>=1.83.0.20260730",
]

# Shared test/lint config so a workspace-wide run behaves identically to the
# per-package config (the hub package also declares these locally).
[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: needs external services (Docker/Envoy); excluded from the default run",
]
# unified-mcp-graphify is excluded from the workspace (heavy graphify deps), so it
# is NOT installed in the workspace venv. Skip it in the workspace-wide `pytest
# packages` run — it has its own standalone suite (`cd packages/unified-mcp-graphify
# && uv run --extra dev pytest`). Without this, collection would ImportError.
addopts = "--ignore=packages/unified-mcp-graphify -m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# The published packages are the ones with an external API surface, so they are
# the ones worth type-checking. The hub keeps its own config.
files = ["packages/unified-enforce/src", "packages/unified-sdk/src"]
# Generated protobuf: its members are built at runtime from a descriptor pool,
# so every message reads as a missing attribute. Checking generated code would
# mean annotating a file we regenerate from a .proto anyway.
exclude = "packages/unified-enforce/src/unified_enforce/protos/"

[[tool.mypy.overrides]]
# Optional framework adapters: these imports are deliberately absent unless the
# matching extra is installed, and on this machine crewai cannot be installed
# at all. Their absence is the designed state, not an error.
module = ["crewai.*", "langchain_core.*", "llama_index.*", "grpc", "celpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["unified_enforce.protos.*"]
follow_imports = "skip"
